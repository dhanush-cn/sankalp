name: sankalp

services:
  postgres:
    image: postgres:16
    container_name: sankalp-postgres
    environment:
      POSTGRES_USER: sankalp
      POSTGRES_PASSWORD: sankalp
      POSTGRES_DB: sankalp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the sankalp_test database on a FRESH volume only. The migration
      # runner also creates it if missing, which covers pre-existing volumes.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    # Durability settings (fsync, synchronous_commit, full_page_writes) are left
    # at their safe defaults on purpose: the crash-recovery tests kill processes
    # and then assert what survived. Turning those off would invalidate the gate.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c track_io_timing=on
      -c autovacuum_naptime=10s
      -c log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sankalp -d sankalp"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: sankalp-redis
    ports:
      - "6379:6379"
    # No persistence: rate-limiter state is ephemeral by design and the limiter
    # fails open, so losing it on restart is harmless (docs/spec.md, Phase 3).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Network-level fault injection for the Phase 4 chaos suite -- DB latency, connection
  # cuts, a worker<->DB partition, Redis down. 8474 is the control API: chaos tests create
  # and destroy proxies and toxics there at test time, so no fault survives past the test
  # that injected it. 15432 and 16379 are the proxied listeners -- what chaos tests point
  # their DSN at instead of postgres:5432 / redis:6379 directly.
  #
  # The routing is asymmetric on purpose. Toxiproxy's upstream for each proxy is the
  # in-network address (postgres:5432, redis:6379) -- it reaches the database the same way
  # every other container does. But tests run on the host, so they reach Toxiproxy itself
  # through the ports published here (15432, 16379), not through the docker network. A
  # normal test's DSN (test_database_url, port 5432) and a chaos test's DSN (port 15432)
  # therefore take physically different paths to the same Postgres -- one direct, one
  # through the proxy -- which is what lets a toxic on 15432 degrade only the chaos path.
  #
  # No proxies are defined here. They are created and destroyed per-test through the
  # control API, so a stale toxic from one test cannot leak into the next.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: sankalp-toxiproxy
    ports:
      - "8474:8474"
      - "15432:15432"
      - "16379:16379"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
